name: Publish ORYVEX SANTIYE OS

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: santiye-os-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publish repo
        uses: actions/checkout@v4

      - name: Checkout ORYVEX source
        uses: actions/checkout@v4
        with:
          repository: oryvex-systems/ofclskan-oryvex-os
          ref: main
          path: oryvex-source

      - name: Assemble site
        run: |
          rm -rf publish
          mkdir -p publish
          cp -a oryvex-source/apps/oryvex-revakhali/. publish/
          for f in publish/*.html; do
            if [ -f "$f" ] && ! grep -q 'global-nav.js' "$f"; then
              sed -i 's#</body>#<script src="global-nav.js"></script></body>#' "$f"
            fi
          done
          echo 'revakhali.info' > publish/CNAME
          touch publish/.nojekyll

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          force_orphan: true
