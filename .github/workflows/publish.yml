name: Publish ORYVEX SANTIYE OS

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: santiye-os-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publish repo
        uses: actions/checkout@v4

      - name: Checkout ORYVEX source
        uses: actions/checkout@v4
        with:
          repository: oryvex-systems/ofclskan-oryvex-os
          ref: main
          path: oryvex-source

      - name: Assemble site
        run: |
          rm -rf publish
          mkdir -p publish
          cp -a oryvex-source/apps/oryvex-revakhali/. publish/
          for f in publish/*.html; do
            if [ -f "$f" ] && ! grep -q 'global-nav.js' "$f"; then
              sed -i 's#</body>#<script src="global-nav.js"></script></body>#' "$f"
            fi
            if [ -f "$f" ] && ! grep -q 'access-ui.js' "$f"; then
              sed -i 's#</body>#<script src="access-ui.js"></script></body>#' "$f"
            fi
          done
          echo 'revakhali.info' > publish/CNAME
          touch publish/.nojekyll

      - name: Validate app surface
        run: |
          set -euo pipefail
          required=(index.html giris.html modul.html kullanicilar.html merkez.html operasyon.html yonetim.html finans.html depo-evrak.html raporlar.html yonetici.html ayarlar.html global-nav.js access-ui.js)
          for f in "${required[@]}"; do
            test -s "publish/$f" || { echo "Missing required screen: $f"; exit 1; }
          done
          for f in publish/*.html; do
            grep -q 'global-nav.js' "$f" || { echo "Global navigation missing from $f"; exit 1; }
            grep -q 'access-ui.js' "$f" || { echo "Role UI guard missing from $f"; exit 1; }
          done
          grep -q 'santiye-username-login' publish/giris.html
          grep -q 'santiye-admin-user' publish/kullanicilar.html
          grep -q 'santiye_projects' publish/index.html
          grep -q 'santiye_projects' publish/modul.html
          grep -q 'santiye_management_summary' publish/merkez.html
          grep -q 'santiye_stock' publish/depo-evrak.html
          grep -q 'santiye' publish/finans.html
          grep -q 'santiye_internal_users' publish/global-nav.js
          grep -q 'createRoles' publish/access-ui.js
          grep -q 'revakhali.info' publish/CNAME
          echo "ORYVEX SANTIYE OS validation passed."

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          force_orphan: true
