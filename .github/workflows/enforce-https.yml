name: Enforce HTTPS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce HTTPS on GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${GH_REPO}/pages" -F https_enforced=true >/tmp/pages.json
          gh api "repos/${GH_REPO}/pages" --jq '{status, cname, html_url, https_enforced, certificate: .https_certificate.state}'
